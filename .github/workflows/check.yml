name: check
on: [push, pull_request]
jobs:
  regression:
    strategy:
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.lock
      - if: runner.os == 'Linux'
        run: python -m pip install torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -r requirements.lock
      - run: python -m pytest -q
      - run: python -m compileall -q app.py launcher.py vvgpt scripts
      - run: node --check static/studio.js
      - run: bash -n VV_GPT4.command
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.lock
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - if: runner.os == 'Linux'
        run: python -m pip install torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -r requirements.lock
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
        env:
          VVGPT_PYTHON: python
