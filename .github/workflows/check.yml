name: check
on: [push, pull_request]
jobs:
  regression:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.lock
      - run: python -m pytest -q
      - run: python -m compileall -q app.py launcher.py vvgpt
      - run: node --check static/studio.js
      - run: bash -n VV_GPT4.command
