<!doctype html><html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>
*{box-sizing:border-box}body{margin:0;color:var(--foreground);font-family:var(--font-sans)}nav{display:flex;gap:8px;align-items:center;margin-bottom:14px}button{border:1px solid var(--border);border-radius:var(--radius);background:transparent;color:var(--muted-foreground);padding:9px 14px;font:12px var(--font-sans);cursor:pointer}button[aria-selected=true]{background:var(--secondary);color:var(--foreground)}button:focus-visible,a:focus-visible{outline:2px solid var(--ring);outline-offset:3px}nav a{margin-left:auto;font-size:12px;color:var(--primary);text-decoration:none}[hidden]{display:none!important}figure{margin:0}img{display:block;width:100%;height:auto;border:1px solid var(--border);border-radius:var(--radius)}.mobile img{max-width:300px;margin:auto}figcaption{font-size:11px;line-height:1.8;color:var(--muted-foreground);margin-top:12px} @media(max-width:430px){nav{gap:5px}button{padding:8px 10px}nav a{font-size:11px}.mobile img{max-width:260px}}
</style><nav role="tablist" aria-label="Interface views"><button role="tab" aria-selected="true" aria-controls="train" id="train-tab">Train</button><button role="tab" aria-selected="false" aria-controls="generate" id="generate-tab" tabindex="-1">Generate</button><button role="tab" aria-selected="false" aria-controls="mobile" id="mobile-tab" tabindex="-1">Mobile</button><a href="http://127.0.0.1:5054" target="_blank" rel="noopener">Open studio ↗</a></nav>
<section id="train" role="tabpanel" aria-labelledby="train-tab"><figure><img src="/Users/xavier/AI/T3-code/vv-gpt4/docs/studio-desktop.png" alt="Redesigned training workspace with persistent navigation, run selection and a single composed learning chart"><figcaption>Actual local workspace. Train, Generate, Models and Data stay available in the top navigation.</figcaption></figure></section>
<section id="generate" role="tabpanel" aria-labelledby="generate-tab" hidden><figure><img src="/Users/xavier/AI/T3-code/vv-gpt4/docs/playground-desktop.png" alt="Dedicated generation page with prompt controls on the left and readable generated text on the right"><figcaption>Generation has its own workspace. Try this model opens the checkpoint selected in Train.</figcaption></figure></section>
<section id="mobile" class="mobile" role="tabpanel" aria-labelledby="mobile-tab" hidden><figure><img src="/Users/xavier/AI/T3-code/vv-gpt4/docs/studio-mobile.png" alt="Mobile training workspace with the same navigation and stacked learning measurements"><figcaption>Responsive navigation and controls, checked down to a 320-pixel screen.</figcaption></figure></section>
<script>const tabs=[...document.querySelectorAll('[role=tab]')];for(const tab of tabs){tab.onclick=()=>{for(const t of tabs){const on=t===tab;t.setAttribute('aria-selected',on);t.tabIndex=on?0:-1;document.getElementById(t.getAttribute('aria-controls')).hidden=!on}};tab.onkeydown=e=>{if(['ArrowLeft','ArrowRight'].includes(e.key)){e.preventDefault();const next=tabs[(tabs.indexOf(tab)+(e.key==='ArrowRight'?1:tabs.length-1))%tabs.length];next.click();next.focus()}}}</script></html>
